apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: tiangong
  labels:
    app: agent-runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-runtime
  template:
    metadata:
      labels:
        app: agent-runtime
    spec:
      containers:
        - name: agent-runtime
          image: registry.example.com/tiangong/agent-runtime:0.1.0
          ports:
            - containerPort: 8000
          env:
            - name: PYTHONPATH
              value: /app/packages/tiangong_core:/app/services/agent-runtime
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: agent-runtime
  namespace: tiangong
spec:
  selector:
    app: agent-runtime
  ports:
    - port: 80
      targetPort: 8000
